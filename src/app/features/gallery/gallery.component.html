<section class="gallery" aria-labelledby="photos-title">
  <h1 id="photos-title">Photos</h1>

  @if (photos().length > 0) {
    <div class="photo-grid">
      @for (photo of photos(); track photo.id) {
        <button class="photo-card" type="button" (click)="addToFavorites(photo)"
          [attr.aria-pressed]="isFavorite(photo.id)"
          [attr.aria-label]="isFavorite(photo.id) ? photo.alt + ' is in favorites' : 'Add ' + photo.alt + ' to favorites'">
          <img [src]="photo.url" [alt]="photo.alt" loading="lazy">
          <span class="favorite-indicator" aria-hidden="true">
            <mat-icon>{{ isFavorite(photo.id) ? 'favorite' : 'favorite_border' }}</mat-icon>
          </span>
        </button>
      }
    </div>
  }

  @if (isLoading()) {
    <div class="loading-state" role="status">Loading photos...</div>
  }

  @if (favoriteMessage()) {
    <div class="favorite-toast" role="status" aria-live="polite">{{ favoriteMessage() }}</div>
  }
</section>
